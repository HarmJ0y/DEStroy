name: Build DEStroy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build Linux binaries
        run: make

      - name: Create package
        run: |
          mkdir -p DEStroy_linux/kernels
          cp gpu_lookup precompute candidate_lookup candidate_check DEStroy_linux/
          cp kernels/*.cl DEStroy_linux/kernels/
          tar -czvf DEStroy_linux.tar.gz DEStroy_linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEStroy_linux
          path: DEStroy_linux.tar.gz

  build-windows:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mingw
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip

      - name: Build Windows binaries
        run: make windows

      - name: Create package
        run: |
          mkdir -p DEStroy_windows/kernels
          cp gpu_lookup.exe precompute.exe candidate_lookup.exe candidate_check.exe DEStroy_windows/
          cp kernels/*.cl DEStroy_windows/kernels/
          zip -r DEStroy_windows.zip DEStroy_windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEStroy_windows
          path: DEStroy_windows.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: DEStroy_linux
          path: .

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: DEStroy_windows
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            DEStroy_linux.tar.gz
            DEStroy_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}