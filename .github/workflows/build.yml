name: Build DEStroy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: alpine:latest
    
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache git gcc musl-dev make opencl-headers

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Linux binaries (static)
        run: make static

      - name: Rename binaries
        run: |
          mv gpu_lookup gpu_lookup-linux-x64
          mv precompute precompute-linux-x64
          mv candidate_lookup candidate_lookup-linux-x64
          mv candidate_check candidate_check-linux-x64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: destroy-linux-x64
          path: |
            gpu_lookup-linux-x64
            precompute-linux-x64
            candidate_lookup-linux-x64
            candidate_check-linux-x64

  build-windows:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mingw
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build Windows binaries (static)
        run: make static-windows

      - name: Rename binaries
        run: |
          mv gpu_lookup.exe gpu_lookup-windows-x64.exe
          mv precompute.exe precompute-windows-x64.exe
          mv candidate_lookup.exe candidate_lookup-windows-x64.exe
          mv candidate_check.exe candidate_check-windows-x64.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: destroy-windows-x64
          path: |
            gpu_lookup-windows-x64.exe
            precompute-windows-x64.exe
            candidate_lookup-windows-x64.exe
            candidate_check-windows-x64.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: destroy-linux-x64
          path: binaries

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: destroy-windows-x64
          path: binaries

      - name: Make Linux binaries executable
        run: chmod +x binaries/*-linux-x64

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            binaries/gpu_lookup-linux-x64
            binaries/precompute-linux-x64
            binaries/candidate_lookup-linux-x64
            binaries/candidate_check-linux-x64
            binaries/gpu_lookup-windows-x64.exe
            binaries/precompute-windows-x64.exe
            binaries/candidate_lookup-windows-x64.exe
            binaries/candidate_check-windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}