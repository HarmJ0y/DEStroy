name: Build DEStroy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: alpine:latest
    
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache git gcc musl-dev make opencl-headers

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Linux binaries (static)
        run: make static

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: destroy-linux-x64
          path: |
            gpu_lookup
            precompute
            candidate_lookup
            candidate_check

  build-windows:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mingw
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build Windows binaries (static)
        run: make static-windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: destroy-windows-x64
          path: |
            gpu_lookup.exe
            precompute.exe
            candidate_lookup.exe
            candidate_check.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: destroy-linux-x64
          path: linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: destroy-windows-x64
          path: windows

      - name: Create archives
        run: |
          cd linux && chmod +x * && tar -czvf ../destroy-linux-x64.tar.gz * && cd ..
          cd windows && zip -r ../destroy-windows-x64.zip * && cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            destroy-linux-x64.tar.gz
            destroy-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}